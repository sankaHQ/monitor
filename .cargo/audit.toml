# cargo audit (CI's Dependency audit job). Every ignore names why the advisory
# can't reach Monitor and when to look again.
[advisories]
ignore = [
  # libsqlite3-sys 0.30.1 (rusqlite 0.32, bundled SQLite): SQLite before
  # 3.54.0 can return uninitialized page-cache memory when it opens a database
  # together with a crafted -wal file of a different page size that a less
  # trusted party wrote. Monitor opens browser history files with
  # immutable=1, which never reads a -wal file, and otherwise opens only its
  # own store in its app data folder. The fix is libsqlite3-sys 0.39 through
  # rusqlite 0.41, a breaking upgrade from 0.32 for the store and the browser
  # check. Make that upgrade and remove this line by 2026-12-31.
  "RUSTSEC-2026-0459",
]
