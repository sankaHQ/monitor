# Sanka Monitor agent releases (README.md#release, docs/windows.md#release), published
# from this repository: signed and notarized macOS apps for Apple silicon (arm64) and
# for every Mac (universal), a signed and notarized .pkg for device management, and an
# Authenticode-signed Windows installer (NSIS) and per-machine MSI. Every file gets a
# SHA-256 in SHA256SUMS and a GitHub build-provenance attestation, and is uploaded to
# release.sanka.com/monitor/ before the GitHub release is created here. The updater
# reads latest.json from the CDN first and from this repository's latest release second.
# channels/stable.json, which sanka.com's download links follow, is written last.
#
# 0.4.0 moves releases here from sankaHQ/monitor-releases. With bridge_to_monitor_releases
# the same files are also published there once, so agents up to 0.3.x (which read
# monitor-releases' latest.json) update to a build that reads the new feed.
name: Release (macOS + Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag: v + the version in apps/agent/src-tauri/Cargo.toml (for example: v0.4.0)"
        required: true
      dry_run:
        description: "Build, sign, and notarize, but upload artifacts to this run instead of publishing"
        type: boolean
        default: true
      release_notes:
        description: "Notes shown on the GitHub release and in the app after it updates"
        required: false
        default: "Sanka Monitor agent update."
      bridge_to_monitor_releases:
        description: "Also publish to sankaHQ/monitor-releases, so agents up to 0.3.x find this build"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-monitor
  cancel-in-progress: false

jobs:
  preflight:
    name: Check version and secrets
    runs-on: ubuntu-latest
    # Named as the Actions secrets, so a missing one is reported by its own name.
    env:
      MACOS_APPLE_CERTIFICATE: ${{ secrets.MACOS_APPLE_CERTIFICATE }}
      MACOS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APPLE_CERTIFICATE_PASSWORD }}
      MACOS_APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_APPLE_SIGNING_IDENTITY }}
      MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
      MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
      MACOS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
      MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
      MACOS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_APPLE_APP_SPECIFIC_PASSWORD }}
      MACOS_APPLE_TEAM_ID: ${{ secrets.MACOS_APPLE_TEAM_ID }}
      TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
      MONITOR_AZURE_TENANT_ID: ${{ secrets.MONITOR_AZURE_TENANT_ID }}
      MONITOR_AZURE_CLIENT_ID: ${{ secrets.MONITOR_AZURE_CLIENT_ID }}
      MONITOR_AZURE_CLIENT_SECRET: ${{ secrets.MONITOR_AZURE_CLIENT_SECRET }}
      MONITOR_AZURE_SIGNING_ENDPOINT: ${{ secrets.MONITOR_AZURE_SIGNING_ENDPOINT }}
      MONITOR_AZURE_SIGNING_ACCOUNT: ${{ secrets.MONITOR_AZURE_SIGNING_ACCOUNT }}
      MONITOR_AZURE_SIGNING_PROFILE: ${{ secrets.MONITOR_AZURE_SIGNING_PROFILE }}
      MONITOR_CDN_ACCESS_KEY_ID: ${{ secrets.MONITOR_CDN_ACCESS_KEY_ID }}
      MONITOR_CDN_SECRET_ACCESS_KEY: ${{ secrets.MONITOR_CDN_SECRET_ACCESS_KEY }}
      MONITOR_CDN_BUCKET: ${{ secrets.MONITOR_CDN_BUCKET }}
      MONITOR_RELEASES_TOKEN: ${{ secrets.MONITOR_RELEASES_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The updater installs latest.json's version whenever it is newer than
      # the running build, so a tag above the built version would make every
      # agent reinstall the same build and restart, over and over.
      - name: Check the tag matches the agent version
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          configured=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/agent/src-tauri/Cargo.toml | head -1)
          if [ "v${configured}" != "${RELEASE_TAG}" ]; then
            echo "apps/agent/src-tauri/Cargo.toml has version ${configured}: release it as v${configured}, not ${RELEASE_TAG}" >&2
            exit 1
          fi

      # Every secret the builds need, checked before either build starts. The CDN
      # and the bridge token are only needed to publish.
      # A Windows release is always Authenticode-signed: there is no unsigned path.
      - name: Validate required secrets
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          BRIDGE: ${{ inputs.bridge_to_monitor_releases }}
        run: |
          set -euo pipefail
          missing=0
          require() {
            local purpose=$1
            shift
            for key in "$@"; do
              if [ -z "${!key:-}" ]; then
                echo "::error::Missing required secret: ${key} (${purpose})"
                missing=1
              fi
            done
          }
          require "macOS Developer ID signing and notarization" \
            MACOS_APPLE_CERTIFICATE MACOS_APPLE_CERTIFICATE_PASSWORD MACOS_APPLE_SIGNING_IDENTITY \
            MACOS_APPLE_ID MACOS_APPLE_APP_SPECIFIC_PASSWORD MACOS_APPLE_TEAM_ID
          require "macOS Developer ID Installer signing (the .pkg for device management)" \
            MACOS_INSTALLER_CERTIFICATE MACOS_INSTALLER_CERTIFICATE_PASSWORD MACOS_INSTALLER_SIGNING_IDENTITY
          require "updater signing, macOS and Windows" \
            TAURI_UPDATER_PRIVATE_KEY TAURI_UPDATER_PRIVATE_KEY_PASSWORD
          require "Windows Authenticode signing through Microsoft Artifact Signing" \
            MONITOR_AZURE_TENANT_ID MONITOR_AZURE_CLIENT_ID MONITOR_AZURE_CLIENT_SECRET \
            MONITOR_AZURE_SIGNING_ENDPOINT MONITOR_AZURE_SIGNING_ACCOUNT MONITOR_AZURE_SIGNING_PROFILE
          if [ "$DRY_RUN" != "true" ]; then
            require "uploading to release.sanka.com" \
              MONITOR_CDN_ACCESS_KEY_ID MONITOR_CDN_SECRET_ACCESS_KEY MONITOR_CDN_BUCKET
            if [ "$BRIDGE" = "true" ]; then
              require "the bridge release in sankaHQ/monitor-releases (fine-grained PAT, contents:write)" \
                MONITOR_RELEASES_TOKEN
            fi
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing Actions secrets to this repository (README.md#release, docs/windows.md#release), then run the release again." >&2
            exit 1
          fi

  macos:
    name: macOS ${{ matrix.name }} (signed + notarized)
    needs: preflight
    runs-on: macos-14
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: arm64
            target: aarch64-apple-darwin
            archs: arm64
            pkg: false
          # The universal app also runs on Intel Macs, and is the one the .pkg
          # installs, so device management needs only one package.
          - name: universal
            target: universal-apple-darwin
            archs: arm64 x86_64
            pkg: true
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_APPLE_SIGNING_IDENTITY }}
      INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.MACOS_APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.MACOS_APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # One keychain holds both certificates for the whole job: Tauri signs the
      # app from it, and the DMG and the .pkg are signed after Tauri finishes.
      - name: Import signing certificates
        env:
          APP_CERT: ${{ secrets.MACOS_APPLE_CERTIFICATE }}
          APP_CERT_PASSWORD: ${{ secrets.MACOS_APPLE_CERTIFICATE_PASSWORD }}
          INSTALLER_CERT: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/monitor-signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APP_CERT" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER_CERT" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$APP_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$INSTALLER_CERT_PASSWORD" -T /usr/bin/productsign -T /usr/bin/pkgbuild
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$keychain"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/agent

      # Tauri signs with the keychain identity, notarizes and staples the app,
      # then signs the updater tarball. Tauri skips the Finder script that lays
      # out the DMG (background, icon positions) whenever CI is set, so it is
      # unset here: the runner has a GUI session for Finder.
      - name: Build, sign, and notarize the app
        run: npm run tauri build -- --target ${{ matrix.target }}
        working-directory: apps/agent
        env:
          CI: "false"

      - name: Verify the app
        env:
          TARGET: ${{ matrix.target }}
          ARCHS: ${{ matrix.archs }}
        run: |
          set -euo pipefail
          app=$(ls -d target/$TARGET/release/bundle/macos/*.app)
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          found=$(lipo -archs "$app/Contents/MacOS/$executable" | tr ' ' '\n' | sort | xargs)
          expected=$(echo "$ARCHS" | tr ' ' '\n' | sort | xargs)
          if [ "$found" != "$expected" ]; then
            echo "$app has architectures '$found', expected '$expected'" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      # Tauri notarizes the app inside the DMG, not the DMG itself: sign, notarize
      # and staple it so Gatekeeper accepts the download without a network check.
      - name: Sign, notarize, and staple the DMG
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dmg=$(ls target/$TARGET/release/bundle/dmg/*.dmg)
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

      # The .pkg installs the app in /Applications with a login agent for every
      # person and opens it for whoever is signed in (apps/agent/pkg/), so a
      # deployment token placed by device management connects the Mac with
      # nothing for the person to do.
      - name: Build, sign, notarize, and staple the .pkg
        if: ${{ matrix.pkg }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          app=$(ls -d target/$TARGET/release/bundle/macos/*.app)
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          root="$RUNNER_TEMP/pkgroot"
          mkdir -p "$root/Applications"
          # No extended attributes: they would ship as ._ files in the payload.
          ditto --norsrc --noextattr --noacl apps/agent/pkg/root "$root"
          ditto --norsrc --noextattr --noacl "$app" "$root/Applications/$(basename "$app")"
          xattr -cr "$root"
          COPYFILE_DISABLE=1 pkgbuild --root "$root" --install-location / \
            --component-plist apps/agent/pkg/components.plist \
            --scripts apps/agent/pkg/scripts \
            --identifier com.sanka.monitor.pkg --version "$version" \
            --sign "$INSTALLER_SIGNING_IDENTITY" --timestamp \
            "target/$TARGET/release/bundle/monitor.pkg"
          pkg="target/$TARGET/release/bundle/monitor.pkg"
          if pkgutil --payload-files "$pkg" | grep -q '/\._'; then
            echo "the .pkg payload contains AppleDouble (._) files" >&2
            exit 1
          fi
          xcrun notarytool submit "$pkg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$pkg"
          pkgutil --check-signature "$pkg"
          spctl --assess --type install --verbose=4 "$pkg"

      - name: Collect
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          bundle="target/$TARGET/release/bundle"
          mkdir -p out
          one() {
            local matches=( $1 )
            if [ "${#matches[@]}" -ne 1 ] || [ ! -e "${matches[0]}" ]; then
              echo "expected exactly one match for $1, got ${matches[*]:-none}" >&2
              exit 1
            fi
            echo "${matches[0]}"
          }
          cp "$(one "$bundle/dmg/*.dmg")" "out/monitor-$NAME.dmg"
          cp "$(one "$bundle/macos/*.app.tar.gz")" "out/monitor-$NAME.app.tar.gz"
          cp "$(one "$bundle/macos/*.app.tar.gz.sig")" "out/monitor-$NAME.app.tar.gz.sig"
          if [ -f "$bundle/monitor.pkg" ]; then cp "$bundle/monitor.pkg" out/monitor.pkg; fi
          ls -l out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: monitor-macos-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/monitor-signing.keychain-db" || true

  windows:
    name: Windows (NSIS + MSI, Authenticode-signed)
    needs: preflight
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
      # Microsoft Artifact Signing (Authenticode), publisher Sanka, Inc.
      AZURE_TENANT_ID: ${{ secrets.MONITOR_AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.MONITOR_AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.MONITOR_AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.MONITOR_AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.MONITOR_AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ secrets.MONITOR_AZURE_SIGNING_PROFILE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET signing runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Configure Authenticode signing
        shell: pwsh
        run: ./scripts/setup-windows-signing.ps1

      - name: Test signing service before building Monitor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command '7z.exe' -ErrorAction Stop | Out-Null
          $probe = Join-Path $env:RUNNER_TEMP 'monitor signing probe'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <UseAppHost>true</UseAppHost>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -LiteralPath (Join-Path $probe 'MonitorSigningProbe.csproj')
          Set-Content -LiteralPath (Join-Path $probe 'Program.cs') -Value 'System.Console.WriteLine("Sanka Monitor internal signing check. Not a Monitor release.");'
          dotnet publish (Join-Path $probe 'MonitorSigningProbe.csproj') --configuration Release --runtime win-x64 --self-contained false --output (Join-Path $probe 'out') --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the internal signing probe.' }
          ./scripts/sign-windows.ps1 -FilePath (Join-Path $probe 'out/MonitorSigningProbe.exe')

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: monitor-release
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/agent

      # The per-user NSIS installer is the download and the update package. The
      # per-machine MSI is for device management (Intune), which installs for
      # every user of the PC; it is not an update package.
      - name: Build and sign installers
        shell: bash
        run: npm run tauri build -- --config src-tauri/tauri.signing.conf.json --bundles nsis,msi
        working-directory: apps/agent

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer; found $($installers.Count)."
          }
          $msis = @(Get-ChildItem -LiteralPath 'target/release/bundle/msi' -Filter '*.msi' -File)
          if ($msis.Count -ne 1) {
            throw "Expected one MSI; found $($msis.Count)."
          }
          # Tauri restores the unsigned Cargo binary after bundling. Verify the
          # actual packaged executable, without installing or launching it.
          $payload = Join-Path $env:RUNNER_TEMP 'monitor signed payload'
          & 7z.exe x $installers[0].FullName "-o$payload" -y
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not extract the Windows installer for signature verification.'
          }
          $applications = @(Get-ChildItem -LiteralPath $payload -Filter 'sanka-monitor-agent.exe' -File -Recurse)
          if ($applications.Count -ne 1) {
            throw "Expected one packaged Monitor executable; found $($applications.Count)."
          }
          $files = @($applications[0], $installers[0], $msis[0])
          $results = foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $($file.Name): $($signature.StatusMessage)"
            }
            $publisher = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($publisher -cne 'Sanka, Inc.') {
              throw "Unexpected publisher on $($file.Name): $publisher"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Missing timestamp on $($file.Name)."
            }
            [ordered]@{
              file = $file.Name
              sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
              status = $signature.Status.ToString()
              publisher = $publisher
              subject = $signature.SignerCertificate.Subject
              thumbprint = $signature.SignerCertificate.Thumbprint
              certificateExpires = $signature.SignerCertificate.NotAfter.ToUniversalTime().ToString('o')
              timestampSubject = $signature.TimeStamperCertificate.Subject
            }
          }
          New-Item -ItemType Directory -Force -Path 'out' | Out-Null
          $results | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath 'out/windows-signatures.json' -Encoding utf8
          Get-Content -LiteralPath 'out/windows-signatures.json'

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(target/release/bundle/nsis/*-setup.exe)
          signatures=(target/release/bundle/nsis/*-setup.exe.sig)
          msis=(target/release/bundle/msi/*.msi)
          if [ "${#installers[@]}" -ne 1 ] || [ "${#signatures[@]}" -ne 1 ] || [ "${#msis[@]}" -ne 1 ]; then
            echo "Expected one installer, one updater signature and one MSI; found ${#installers[@]}, ${#signatures[@]} and ${#msis[@]}." >&2
            exit 1
          fi
          mkdir -p out
          cp "${installers[0]}" out/monitor-setup.exe
          cp "${signatures[0]}" out/monitor-setup.exe.sig
          cp "${msis[0]}" out/monitor.msi
          ls -l out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: monitor-windows
          path: out/*
          if-no-files-found: error

  publish:
    name: Checksums, attestations, CDN and release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    # Publishing needs the release environment (its reviewers approve the run);
    # a dry run doesn't publish anything and runs without it.
    environment: ${{ inputs.dry_run && 'release-dry-run' || 'release' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CDN_BASE: https://release.sanka.com/monitor
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: builds

      # Asset names follow tracking/monitor-0.4-redesign/contract.md in the
      # umbrella repo: sanka.com's download links read channels/stable.json.
      - name: Name assets, write SHA256SUMS, latest.json and stable.json
        env:
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: python3 scripts/release_manifest.py builds out

      - name: Upload to this run (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: sanka-monitor-${{ inputs.version }}
          path: out/*
          if-no-files-found: error

      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/release/*.dmg
            out/release/*.tar.gz
            out/release/*.exe
            out/release/*.msi
            out/release/*.pkg

      # Versioned files first, then the stable-named copies and latest.json; the
      # GitHub release next; channels/stable.json last, so a download link never
      # points at a file that isn't there yet.
      - name: Upload to release.sanka.com
        if: ${{ !inputs.dry_run }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MONITOR_CDN_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MONITOR_CDN_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_ENDPOINT_URL_S3: ${{ vars.MONITOR_CDN_ENDPOINT || 'https://t3.storage.dev' }}
          BUCKET: ${{ secrets.MONITOR_CDN_BUCKET }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          prefix="s3://$BUCKET/monitor"
          for file in out/release/*; do
            name=$(basename "$file")
            aws s3 cp "$file" "$prefix/$RELEASE_TAG/$name" --only-show-errors \
              --cache-control "public, max-age=31536000, immutable" \
              --content-disposition "attachment; filename=\"$name\""
          done
          for file in out/latest/*; do
            name=$(basename "$file")
            aws s3 cp "$file" "$prefix/latest/$name" --only-show-errors \
              --cache-control "public, max-age=300" \
              --content-disposition "attachment; filename=\"$name\""
          done
          aws s3 cp out/latest.json "$prefix/latest.json" --only-show-errors \
            --cache-control "public, max-age=300" --content-type application/json

      - name: Publish the GitHub release here
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Sanka Monitor $RELEASE_TAG" --notes "$RELEASE_NOTES" \
            --latest out/release/* out/latest.json
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

      - name: Publish the bridge release to sankaHQ/monitor-releases
        if: ${{ !inputs.dry_run && inputs.bridge_to_monitor_releases }}
        env:
          GH_TOKEN: ${{ secrets.MONITOR_RELEASES_TOKEN }}
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo sankaHQ/monitor-releases \
            --title "Sanka Monitor $RELEASE_TAG" \
            --notes "$RELEASE_NOTES

          Sanka Monitor now publishes from https://github.com/sankaHQ/monitor/releases and https://sanka.com/monitor/download/. This repository no longer receives releases." \
            --latest out/release/* out/latest.json

      - name: Point channels/stable.json at this release
        if: ${{ !inputs.dry_run }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MONITOR_CDN_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MONITOR_CDN_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_ENDPOINT_URL_S3: ${{ vars.MONITOR_CDN_ENDPOINT || 'https://t3.storage.dev' }}
          BUCKET: ${{ secrets.MONITOR_CDN_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp out/stable.json "s3://$BUCKET/monitor/channels/stable.json" --only-show-errors \
            --cache-control "public, max-age=60" --content-type application/json

      # Downloads every published file back through the CDN and compares it with
      # SHA256SUMS, so a broken upload fails the run instead of reaching people.
      - name: Verify the CDN serves what was built
        if: ${{ !inputs.dry_run }}
        run: python3 scripts/release_manifest.py --verify out "$CDN_BASE"
