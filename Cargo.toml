[workspace]
resolver = "2"
members = [
  "apps/agent/src-tauri",
  "crates/monitor-core",
  "crates/monitor-findings",
  "crates/monitor-inventory",
  "crates/monitor-posture",
  "crates/monitor-report",
  "crates/monitor-saas",
  "crates/monitor-usage",
  "crates/monitor-store",
  "crates/monitor-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Sanka"]
repository = "https://github.com/sankaHQ/monitor"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
monitor-core = { path = "crates/monitor-core" }
